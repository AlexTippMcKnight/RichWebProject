
events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=test_limit:10m rate=10r/s;

    server {
        listen 80;
        listen [::]:80;

        location /api/ {
            limit_req zone=test_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://host.docker.internal:3000;
        }

        location / {
            proxy_pass http://host.docker.internal:3000;
        }
    }
}
